name: meinhelfer-gateway

services:
  gateway:
    build:
      context: .
      target: dev
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    env_file: .env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev
    restart: unless-stopped

volumes:
  node_modules:
