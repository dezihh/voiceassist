name: Sync Interaction Model (SMAPI)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ASK CLI auth files
        run: |
          mkdir -p ~/.ask/scripts
          cp .github/ask/git-credential-helper ~/.ask/scripts/git-credential-helper
          cp .github/ask/ask-pre-push ~/.ask/scripts/ask-pre-push
          chmod +x ~/.ask/scripts/git-credential-helper ~/.ask/scripts/ask-pre-push
          echo "${{ secrets.ASK_AUTH_INFO }}" | base64 -d > ~/.ask/auth_info
          echo "${{ secrets.ASK_CLI_CONFIG }}" | base64 -d > ~/.ask/cli_config

      - name: Model-Stand pruefen, synchronisieren, bauen
        env:
          SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
        run: |
          source ~/.ask/auth_info
          REFRESH=$(python3 -c 'import json,os;print(json.load(open(os.path.expanduser("~/.ask/cli_config")))["profiles"]["default"]["token"]["refresh_token"])')
          export ASK_REFRESH_TOKEN="${REFRESH}"
          TOKEN=$(curl -f -s --data-urlencode "grant_type=refresh_token" --data-urlencode "client_id=${ask_client_id}" --data-urlencode "client_secret=${ask_client_confirmation}" --data-urlencode "refresh_token=${REFRESH}" "${ask_lwa_api}"/auth/O2/token)
          ACCESS=$(echo "${TOKEN}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          BASE="${ask_smapi_api}/v1/skills/${SKILL_ID}/stages/development/interactionModel/locales/de-DE"
          MODEL=alexa/skill-package/interactionModels/custom/de-DE.json

          echo "=== Aktuelles Modell im development-Stage (GptQueryIntent):"
          HTTP=$(curl -s -D /tmp/h.txt -o /tmp/current.json -w "%{http_code}" -H "Authorization: Bearer ${ACCESS}" "${BASE}")
          echo "GET -> HTTP ${HTTP}"
          NEED_SYNC=1
          if [ "${HTTP}" = "200" ]; then
            python3 -c 'import json; d=json.load(open("/tmp/current.json")); s=[i["samples"] for i in d["interactionModel"]["languageModel"]["intents"] if i["name"]=="GptQueryIntent"]; print("STAGE-SAMPLES:", json.dumps(s, ensure_ascii=False)); open("/tmp/need_sync","w").write("0" if (s and any("zum thema {query}" in x for x in s[0])) else "1")'
            NEED_SYNC=$(cat /tmp/need_sync)
            ETAG=$(grep -i '^etag:' /tmp/h.txt | tr -d '\r' | cut -d' ' -f2)
            echo "eTag: ${ETAG}, NEED_SYNC=${NEED_SYNC}"
          else
            cat /tmp/current.json; echo ""
            ETAG=""
          fi

          if [ "${NEED_SYNC}" = "1" ]; then
            echo "=== Sauberes Modell per PUT hochladen (triggert Build automatisch):"
            if [ -n "${ETAG}" ]; then
              HTTP=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT -H "Authorization: Bearer ${ACCESS}" -H "Content-Type: application/json" -H "If-Match: ${ETAG}" --data-binary @${MODEL} "${BASE}")
            else
              HTTP=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT -H "Authorization: Bearer ${ACCESS}" -H "Content-Type: application/json" --data-binary @${MODEL} "${BASE}")
            fi
            echo "PUT -> HTTP ${HTTP}"; cat /tmp/put.json; echo ""
          else
            echo "=== Stage-Modell bereits aktuell, kein PUT noetig"
          fi

          echo "=== Build-Status pollen (GET /status?resource=interactionModel):"
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(curl -s -H "Authorization: Bearer ${ACCESS}" "${ask_smapi_api}/v1/skills/${SKILL_ID}/status?resource=interactionModel")
            if [ "$i" = "1" ]; then echo "--- RAW /status (poll 1):"; echo "${STATUS}" | head -c 1200; echo ""; fi
            S=$(echo "${STATUS}" | python3 -c 'import json,sys; d=json.load(sys.stdin); ims=d.get("interactionModel",{}); r=d.get("lastUpdateRequest",{}).get("status","?"); r=[im.get("lastUpdateRequest",{}).get("status","?") for im in ims.values()][0] if (r=="?" and ims) else r; print(r)' 2>/dev/null || echo UNKNOWN)
            echo "  poll $i: ${S}"
            if [ "${S}" = "SUCCEEDED" ] || [ "${S}" = "FAILURE" ]; then
              echo "${STATUS}" | head -c 2000; echo ""
              break
            fi
          done
