name: Sync Manifest (SMAPI)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ASK CLI auth files
        run: |
          mkdir -p ~/.ask/scripts
          cp .github/ask/git-credential-helper ~/.ask/scripts/git-credential-helper
          cp .github/ask/ask-pre-push ~/.ask/scripts/ask-pre-push
          chmod +x ~/.ask/scripts/git-credential-helper ~/.ask/scripts/ask-pre-push
          echo "${{ secrets.ASK_AUTH_INFO }}" | base64 -d > ~/.ask/auth_info
          echo "${{ secrets.ASK_CLI_CONFIG }}" | base64 -d > ~/.ask/cli_config

      - name: Manifest substituieren und per SMAPI setzen
        env:
          SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
        run: |
          sed -e "s#__ALEXA_ENDPOINT__#${{ secrets.ALEXA_ENDPOINT_URI }}#g" -e "s#__ALEXA_PRIVACY_URL__#${{ secrets.ALEXA_PRIVACY_URL }}#g" alexa/skill-package/skill.json > /tmp/manifest.json
          if grep -q '__ALEXA_ENDPOINT__\|__ALEXA_PRIVACY_URL__' /tmp/manifest.json; then echo "::error::Platzhaelter nicht substituiert - Secrets ALEXA_ENDPOINT_URI / ALEXA_PRIVACY_URL leer?"; exit 1; fi
          echo "=== Endpoint im Manifest:"
          grep -A2 '"endpoint"' /tmp/manifest.json
          source ~/.ask/auth_info
          REFRESH=$(python3 -c 'import json,os;print(json.load(open(os.path.expanduser("~/.ask/cli_config")))["profiles"]["default"]["token"]["refresh_token"])')
          export ASK_REFRESH_TOKEN="${REFRESH}"
          TOKEN=$(curl -f -s --data-urlencode "grant_type=refresh_token" --data-urlencode "client_id=${ask_client_id}" --data-urlencode "client_secret=${ask_client_confirmation}" --data-urlencode "refresh_token=${REFRESH}" "${ask_lwa_api}"/auth/O2/token)
          ACCESS=$(echo "${TOKEN}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          BASE="${ask_smapi_api}/v1/skills/${SKILL_ID}/stages/development/manifest"
          echo "=== Aktueller Stage-Endpoint:"
          HTTP=$(curl -s -D /tmp/h.txt -o /tmp/current.json -w "%{http_code}" -H "Authorization: Bearer ${ACCESS}" "${BASE}")
          echo "GET -> HTTP ${HTTP}"
          python3 -c 'import json; d=json.load(open("/tmp/current.json")); print(json.dumps(d.get("manifest",{}).get("apis",{}), ensure_ascii=False))' 2>/dev/null || cat /tmp/current.json
          ETAG=$(grep -i '^etag:' /tmp/h.txt | tr -d '\r' | cut -d' ' -f2)
          echo "eTag: ${ETAG}"
          echo "=== PUT Manifest:"
          if [ -n "${ETAG}" ]; then
            HTTP=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT -H "Authorization: Bearer ${ACCESS}" -H "Content-Type: application/json" -H "If-Match: ${ETAG}" --data-binary @/tmp/manifest.json "${BASE}")
          else
            HTTP=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT -H "Authorization: Bearer ${ACCESS}" -H "Content-Type: application/json" --data-binary @/tmp/manifest.json "${BASE}")
          fi
          echo "PUT -> HTTP ${HTTP}"; cat /tmp/put.json; echo ""
          echo "=== Verifikation (GET danach):"
          sleep 3
          curl -s -H "Authorization: Bearer ${ACCESS}" "${BASE}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get("manifest",{}).get("apis",{}), ensure_ascii=False))'
