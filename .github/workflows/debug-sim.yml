name: Debug Skill Simulation (SMAPI)

on:
  workflow_dispatch:
    inputs:
      utterance:
        description: "Zu simulierende Aeusserung"
        default: "oeffne voice assist"

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ASK CLI auth files
        run: |
          mkdir -p ~/.ask/scripts
          cp .github/ask/git-credential-helper ~/.ask/scripts/git-credential-helper
          cp .github/ask/ask-pre-push ~/.ask/scripts/ask-pre-push
          chmod +x ~/.ask/scripts/git-credential-helper ~/.ask/scripts/ask-pre-push
          echo "${{ secrets.ASK_AUTH_INFO }}" | base64 -d > ~/.ask/auth_info
          echo "${{ secrets.ASK_CLI_CONFIG }}" | base64 -d > ~/.ask/cli_config

      - name: Skill-Simulation
        env:
          SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
          UTTERANCE: ${{ github.event.inputs.utterance }}
        run: |
          source ~/.ask/auth_info
          REFRESH=$(python3 -c 'import json,os;print(json.load(open(os.path.expanduser("~/.ask/cli_config")))["profiles"]["default"]["token"]["refresh_token"])')
          export ASK_REFRESH_TOKEN="${REFRESH}"
          TOKEN=$(curl -f -s --data-urlencode "grant_type=refresh_token" --data-urlencode "client_id=${ask_client_id}" --data-urlencode "client_secret=${ask_client_confirmation}" --data-urlencode "refresh_token=${REFRESH}" "${ask_lwa_api}"/auth/O2/token)
          ACCESS=$(echo "${TOKEN}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          BODY=$(python3 -c 'import json,os;print(json.dumps({"input":{"utterance":os.environ["UTTERANCE"]}}))')
          SIMAPI="https://api.eu.amazonalexa.com"
          SIM=$(curl -s -X POST -H "Authorization: Bearer ${ACCESS}" -H "Content-Type: application/json" -d "${BODY}" "${SIMAPI}/v1/skills/${SKILL_ID}/stages/development/simulations")
          echo "SIM-RAW: ${SIM}"
          SID=$(echo "${SIM}" | python3 -c 'import json,sys; s=sys.stdin.read(); print(json.loads(s).get("id","") if s.strip().startswith("{") else "")') || true
          echo "SIM-ID: ${SID}"
          [ -z "${SID}" ] && { echo "${SIM}"; exit 1; }
          for i in $(seq 1 12); do
            sleep 5
            R=$(curl -s -H "Authorization: Bearer ${ACCESS}" "${SIMAPI}/v1/skills/${SKILL_ID}/stages/development/simulations/${SID}")
            S=$(echo "${R}" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("status",""))')
            echo "poll ${i}: ${S}"
            if [ "${S}" = "FINISHED" ] || [ "${S}" = "FAILED" ]; then
              echo "${R}" | python3 -m json.tool 2>/dev/null | head -c 6000
              break
            fi
          done
