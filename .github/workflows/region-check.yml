name: Region Check (SMAPI EU vs NA)

on:
  workflow_dispatch:

jobs:
  region:
    runs-on: ubuntu-latest
    steps:
      - name: Restore ASK CLI auth files
        run: |
          mkdir -p ~/.ask/scripts
          echo "${{ secrets.ASK_AUTH_INFO }}" | base64 -d > ~/.ask/auth_info
          echo "${{ secrets.ASK_CLI_CONFIG }}" | base64 -d > ~/.ask/cli_config

      - name: Skill-Region pruefen
        env:
          SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
        run: |
          set -e
          source ~/.ask/auth_info
          REFRESH=$(python3 -c 'import json,os;print(json.load(open(os.path.expanduser("~/.ask/cli_config")))["profiles"]["default"]["token"]["refresh_token"])')
          TOKEN=$(curl -f -s --data-urlencode "grant_type=refresh_token" --data-urlencode "client_id=${ask_client_id}" --data-urlencode "client_secret=${ask_client_confirmation}" --data-urlencode "refresh_token=${REFRESH}" "${ask_lwa_api}"/auth/O2/token)
          ACCESS=$(echo "${TOKEN}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          if [ -z "${ACCESS}" ]; then echo "Kein LWA Token"; exit 1; fi
          for R in "https://api.amazonalexa.com" "https://api.eu.amazonalexa.com" "https://api.fe.amazonalexa.com"; do
            echo "=== GET manifest ueber ${R}:"
            HTTP=$(curl -s -o /tmp/m.json -w "%{http_code}" -H "Authorization: Bearer ${ACCESS}" "${R}/v1/skills/${SKILL_ID}/stages/development/manifest")
            echo "HTTP ${HTTP}"
            if [ "${HTTP}" = "200" ]; then
              python3 -c 'import json;d=json.load(open("/tmp/m.json"));print("endpoint uri:", d["manifest"]["apis"]["custom"]["endpoint"]["uri"])' 2>/dev/null || head -c 200 /tmp/m.json
            else
              head -c 200 /tmp/m.json; echo ""
            fi
          done
