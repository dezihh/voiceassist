name: Deploy to Alexa

on:
  push:
    branches: [main]
    paths:
      - "alexa/**"
      - ".github/workflows/deploy-alexa.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ASK CLI auth files
        run: |
          mkdir -p ~/.ask/scripts
          cp .github/ask/git-credential-helper ~/.ask/scripts/git-credential-helper
          cp .github/ask/ask-pre-push ~/.ask/scripts/ask-pre-push
          chmod +x ~/.ask/scripts/git-credential-helper ~/.ask/scripts/ask-pre-push
          echo "${{ secrets.ASK_AUTH_INFO }}" | base64 -d > ~/.ask/auth_info
          echo "${{ secrets.ASK_CLI_CONFIG }}" | base64 -d > ~/.ask/cli_config

      - name: Deploy-Tree aus alexa/ aufbauen
        run: |
          git config user.email "deploy@github-actions.local"
          git config user.name "GitHub Actions Deploy"
          git checkout --orphan alexa-deploy
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name alexa ! -name .git -exec rm -rf {} +
          cp -a alexa/lambda alexa/skill-package .
          rm -rf alexa
          git add -A
          git commit -m "deploy: ${{ github.sha }}"

      - name: Add Alexa-hosted remote with credential helper
        run: |
          SKILL_ID="${{ secrets.ALEXA_SKILL_ID }}"

          # LWA Access-Token aus den ASK-CLI-Dateien
          source ~/.ask/auth_info
          REFRESH=$(python3 -c 'import json,os;print(json.load(open(os.path.expanduser("~/.ask/cli_config")))["profiles"]["default"]["token"]["refresh_token"])')
          export ASK_REFRESH_TOKEN="${REFRESH}"
          TOKEN=$(curl -f -s --data-urlencode "grant_type=refresh_token" --data-urlencode "client_id=${ask_client_id}" --data-urlencode "client_secret=${ask_client_confirmation}" --data-urlencode "refresh_token=${REFRESH}" "${ask_lwa_api}"/auth/O2/token)
          ACCESS=$(echo "${TOKEN}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          if [[ -z "${ACCESS}" ]]; then echo "Kein LWA Access-Token erhalten"; exit 1; fi

          # Alexa-hosted Repo-URL per SMAPI aufloesen
          HOSTED=$(curl -f -s -H "Authorization: Bearer ${ACCESS}" "${ask_smapi_api}"/v1/skills/"${SKILL_ID}"/alexaHosted)
          REPO_URL=$(tr -d '\n' <<< "${HOSTED}" | tr -d ' ' | sed -n 's/.*"url":"\([^{]*\)"},"runtime".*/\1/p')
          if [[ -z "${REPO_URL}" ]]; then echo "Alexa-hosted Repo fuer ${SKILL_ID} nicht gefunden"; exit 1; fi
          echo "Repo-URL aufgeloest"

          git remote remove alexa 2>/dev/null || true
          git remote add alexa "${REPO_URL}"
          HOST_PATH=$(echo "${REPO_URL}" | sed -E 's#^https://##')
          git config "credential.https://${HOST_PATH}".helper ""
          git config "credential.https://${HOST_PATH}".helper "!$HOME/.ask/scripts/git-credential-helper default ${SKILL_ID}"
          git config "credential.https://${HOST_PATH}".UseHttpPath true

      - name: lambda/config.json aus Alexa-Repo erhalten (Pflicht)
        run: |
          git fetch alexa master dev
          if git checkout alexa/master -- lambda/config.json 2>/dev/null || git checkout alexa/dev -- lambda/config.json; then
            git add lambda/config.json
            git commit --amend --no-edit
            echo "config.json aus Alexa-Repo uebernommen"
          else
            echo "::error::lambda/config.json weder im Alexa-master noch -dev gefunden. Bootstrap in der Konsole noetig - Deploy abgebrochen, um die Konfiguration nicht zu loeschen."
            exit 1
          fi

      - name: Push to Alexa-hosted (master = development, dev = Konsole-Sync)
        run: |
          git push --no-verify --force alexa alexa-deploy:master alexa-deploy:dev
          echo "Deployment-Status im Alexa Developer Console pruefen."
