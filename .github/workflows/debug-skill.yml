name: Debug Skill Status (SMAPI)

on:
  workflow_dispatch:
    inputs:
      skill_id:
        description: "Skill-ID (leer = Secret ALEXA_SKILL_ID)"
        default: ""

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ASK CLI auth files
        run: |
          mkdir -p ~/.ask/scripts
          cp .github/ask/git-credential-helper ~/.ask/scripts/git-credential-helper
          cp .github/ask/ask-pre-push ~/.ask/scripts/ask-pre-push
          chmod +x ~/.ask/scripts/git-credential-helper ~/.ask/scripts/ask-pre-push
          echo "${{ secrets.ASK_AUTH_INFO }}" | base64 -d > ~/.ask/auth_info
          echo "${{ secrets.ASK_CLI_CONFIG }}" | base64 -d > ~/.ask/cli_config

      - name: Skill-Diagnose
        env:
          SKILL_ID: ${{ inputs.skill_id || secrets.ALEXA_SKILL_ID }}
        run: |
          source ~/.ask/auth_info
          REFRESH=$(python3 -c 'import json,os;print(json.load(open(os.path.expanduser("~/.ask/cli_config")))["profiles"]["default"]["token"]["refresh_token"])')
          export ASK_REFRESH_TOKEN="${REFRESH}"
          TOKEN=$(curl -f -s --data-urlencode "grant_type=refresh_token" --data-urlencode "client_id=${ask_client_id}" --data-urlencode "client_secret=${ask_client_confirmation}" --data-urlencode "refresh_token=${REFRESH}" "${ask_lwa_api}"/auth/O2/token)
          ACCESS=$(echo "${TOKEN}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          echo "=== invocationName + Samples (development):"
          curl -s -H "Authorization: Bearer ${ACCESS}" "${ask_smapi_api}/v1/skills/${SKILL_ID}/stages/development/interactionModel/locales/de-DE" | python3 -c 'import json,sys; d=json.load(sys.stdin); lm=d.get("interactionModel",{}).get("languageModel",{}); print("invocationName:", repr(lm.get("invocationName"))); [print("intent", i["name"], "samples:", json.dumps(i.get("samples",[]), ensure_ascii=False)) for i in lm.get("intents",[]) if i["name"] in ("GptQueryIntent","AMAZON.FallbackIntent")]'
          echo "=== Manifest-Endpoint (development):"
          curl -s -H "Authorization: Bearer ${ACCESS}" "${ask_smapi_api}/v1/skills/${SKILL_ID}/stages/development/manifest" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get("manifest",{}).get("apis",{}), ensure_ascii=False))'
          echo "=== Manifest-Build-Status (resource=manifest):"
          curl -s -H "Authorization: Bearer ${ACCESS}" "${ask_smapi_api}/v1/skills/${SKILL_ID}/status?resource=manifest" | head -c 2500
          echo ""

      - name: Alexa-Repo-Baum pruefen (requirements.txt + lambda/)
        env:
          SKILL_ID: ${{ inputs.skill_id || secrets.ALEXA_SKILL_ID }}
        run: |
          mkdir -p ~/.ask/scripts
          echo "${{ secrets.ASK_AUTH_INFO }}" | base64 -d > ~/.ask/auth_info
          echo "${{ secrets.ASK_CLI_CONFIG }}" | base64 -d > ~/.ask/cli_config
          source ~/.ask/auth_info
          REFRESH=$(python3 -c 'import json,os;print(json.load(open(os.path.expanduser("~/.ask/cli_config")))["profiles"]["default"]["token"]["refresh_token"])')
          export ASK_REFRESH_TOKEN="${REFRESH}"
          REPO_ID="${SKILL_ID#amzn1.ask.skill.}"
          REPO_URL="https://git-codecommit.us-east-1.amazonaws.com/v1/repos/${REPO_ID}"
          HOST_PATH=$(echo "${REPO_URL}" | sed -E 's#^https://##')
          git config "credential.https://${HOST_PATH}".helper "!$HOME/.ask/scripts/git-credential-helper default ${SKILL_ID}"
          git config "credential.https://${HOST_PATH}".UseHttpPath true
          git remote add alexa "${REPO_URL}" 2>/dev/null || true
          git fetch alexa '+refs/heads/*:refs/remotes/alexa/*'
          echo "=== skill.json endpoint auf alexa/master:"
          git show alexa/master:skill-package/skill.json 2>&1 | grep -A3 '"endpoint"' || echo "FEHLT"
          echo "=== skill.json endpoint auf alexa/dev:"
          git show alexa/dev:skill-package/skill.json 2>&1 | grep -A3 '"endpoint"' || echo "FEHLT"
          echo "=== requirements.txt auf alexa/master:"
          git show alexa/master:lambda/requirements.txt 2>&1 || echo "FEHLT"
          echo "=== requirements.txt auf alexa/dev:"
          git show alexa/dev:lambda/requirements.txt 2>&1 || echo "FEHLT"
          echo "=== lambda/ auf alexa/master:"
          git ls-tree --name-only "alexa/master:lambda" 2>&1
          echo "=== config.json gateway_token-Hash (hosted dev, nur Hash):"
          git show alexa/dev:lambda/config.json 2>/dev/null | python3 -c 'import json,hashlib,sys; c=json.load(sys.stdin); print("gateway_url:", c.get("gateway_url")); print("token-hash:", hashlib.sha256(c.get("gateway_token","").encode()).hexdigest()[:10])' || echo "FEHLT"
          echo "=== watchdog (hosted dev):"
          git show alexa/dev:lambda/config.json 2>/dev/null | python3 -c 'import json,sys; c=json.load(sys.stdin); print({k:v for k,v in c.items() if k!="gateway_token"})' || true

      - name: Deployed lambda_function.py kompilieren (dev + master)
        env:
          SKILL_ID: ${{ inputs.skill_id || secrets.ALEXA_SKILL_ID }}
        run: |
          source ~/.ask/auth_info
          REFRESH=$(python3 -c 'import json,os;print(json.load(open(os.path.expanduser("~/.ask/cli_config")))["profiles"]["default"]["token"]["refresh_token"])')
          export ASK_REFRESH_TOKEN="${REFRESH}"
          REPO_ID="${SKILL_ID#amzn1.ask.skill.}"
          REPO_URL="https://git-codecommit.us-east-1.amazonaws.com/v1/repos/${REPO_ID}"
          HOST_PATH=$(echo "${REPO_URL}" | sed -E 's#^https://##')
          git config "credential.https://${HOST_PATH}".helper "!$HOME/.ask/scripts/git-credential-helper default ${SKILL_ID}"
          git config "credential.https://${HOST_PATH}".UseHttpPath true
          git remote add alexa "${REPO_URL}" 2>/dev/null || true
          git fetch alexa '+refs/heads/*:refs/remotes/alexa/*'
          for B in dev master; do
            echo "=== ${B}: lambda_function.py kompilieren:"
            if git show "alexa/${B}:lambda/lambda_function.py" > /tmp/lf.py 2>/dev/null; then
              python3 -m py_compile /tmp/lf.py && echo "OK - kompiliert sauber" || python3 -m py_compile /tmp/lf.py
            else
              echo "FEHLT im Branch ${B}"
            fi
            echo "=== ${B}: trailing whitespace (letzte 5):"
            git show "alexa/${B}:lambda/lambda_function.py" | grep -nP "[ \t]+$" | head -5 || echo "keine"
          done
